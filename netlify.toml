[build]
  # Keep the monorepo base at the repository root. The build wrapper strips
  # over-scoped Netlify/plugin secrets before spawning the web package build;
  # the web package still runs the fail-closed environment checker before Next.
  command = "node scripts/run-netlify-web-build.mjs"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION                    = "22.23.2"
  PNPM_VERSION                    = "10.33.0"
  SECRETS_SCAN_ENABLED            = "true"
  SECRETS_SCAN_OMIT_PATHS         = ""
  # These are intentionally non-confidential public client values and deployment
  # identifiers. Keep every credential and database connection value scanned.
  SECRETS_SCAN_OMIT_KEYS          = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_REVENUECAT_WEB_KEY,NEXT_PUBLIC_SENTRY_DSN,NEXT_PUBLIC_POSTHOG_KEY,NEXT_SUPABASE_PROJECT_ID,NEXT_SUPABASE_URL,NETLIFY_SITE_ID"

# Stable /api/* paths are owned by the reviewed Next.js catch-all route. It
# derives its allowlist from supabase/deployment-contract.json and resolves the
# selected environment from validated public configuration. Do not add a
# project-pinned Supabase redirect here: it would let a preview silently write
# to production and would make plain `next dev` behave differently from Netlify.

# Netlify static-response defence in depth. The Next.js API gateway and
# Supabase Edge responses also emit private/no-store headers.

[[headers]]
  for = "/api/*"

  [headers.values]
    Cache-Control = "private, no-store, max-age=0"
    Pragma        = "no-cache"
    Vary          = "Authorization, Cookie"

[[headers]]
  for = "/*"

  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()
