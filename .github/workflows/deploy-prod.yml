name: Deploy Production

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify production release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Refuse a non-production ref
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Production releases are allowed only from refs/heads/main."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"

      - name: Enable pnpm 10.33.0
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete non-mutating release gate
        run: pnpm verify:web
        env:
          CI: true
          NEXT_PUBLIC_APP_ENV: test
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: public-anon-key-for-build-only
          NEXT_PUBLIC_REVENUECAT_WEB_KEY: test_revenuecat_key

  deploy-functions-prod:
    name: Deploy Supabase foundation
    runs-on: ubuntu-latest
    environment: PrompTED.AI
    needs: verify-release
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"

      - name: Validate protected target inputs
        shell: bash
        run: |
          missing=()
          [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]] && missing+=("SUPABASE_ACCESS_TOKEN")
          [[ -z "${SUPABASE_DB_PASSWORD:-}" ]] && missing+=("PROD_SUPABASE_DB_PASSWORD")
          [[ -z "${SUPABASE_PROJECT_REF:-}" ]] && missing+=("PROD_SUPABASE_PROJECT_REF")
          [[ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]] && missing+=("PROD_SUPABASE_SERVICE_ROLE_KEY")
          [[ -z "${SUPABASE_URL:-}" ]] && missing+=("PROD_SUPABASE_URL")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing protected production input(s): ${missing[*]}."
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.PROD_SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}

      - name: Check static deployment compatibility
        run: node scripts/check-deployment-contract.mjs

      - name: Validate the production target before mutation
        run: node scripts/probe-supabase-contract.mjs
        env:
          SUPABASE_PROBE_MODE: target
          SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.PROD_SUPABASE_PROJECT_REF }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: "2.84.2"

      - name: Validate required Supabase secret names without reading values
        run: node scripts/check-supabase-secret-names.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.PROD_SUPABASE_PROJECT_REF }}

      - name: Link the exact Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.PROD_SUPABASE_PROJECT_REF }}

      - name: Apply ordered database migrations
        run: supabase db push --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}

      - name: Probe the applied live schema
        run: node scripts/probe-supabase-contract.mjs
        env:
          SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.PROD_SUPABASE_PROJECT_REF }}

      - name: Deploy named contract functions
        run: node scripts/deploy-contract-functions.mjs --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.PROD_SUPABASE_PROJECT_REF }}

      - name: Smoke-probe function cold starts
        run: node scripts/probe-supabase-contract.mjs
        env:
          SUPABASE_PROBE_MODE: smoke
          SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.PROD_SUPABASE_PROJECT_REF }}

  deploy-web-prod:
    name: Deploy web app to Netlify
    runs-on: ubuntu-latest
    environment: PrompTED.AI
    needs: deploy-functions-prod
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"

      - name: Enable pnpm 10.33.0
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Netlify CLI
        run: npm install -g netlify-cli@27.3.0

      - name: Deploy the verified revision to the protected Netlify site
        run: >-
          node scripts/deploy-netlify-production.mjs
          --site-id "$NETLIFY_SITE_ID"
          --git-sha "$GITHUB_SHA"
          --url "$PRODUCTION_URL"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PROD_SITE_ID }}
          PRODUCTION_URL: ${{ secrets.PROD_WEB_URL }}
          PROMPTED_PRODUCTION_URL: ${{ secrets.PROD_WEB_URL }}
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_REVENUECAT_WEB_KEY: ${{ secrets.PROD_REVENUECAT_WEB_KEY }}
          SECRETS_SCAN_OMIT_KEYS: NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_REVENUECAT_WEB_KEY,NEXT_PUBLIC_SENTRY_DSN,NEXT_PUBLIC_POSTHOG_KEY
