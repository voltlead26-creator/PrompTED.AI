name: CI

on:
  push:
    branches:
      - Thought-Enhanced-Document
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Node 22 web release gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"

      - name: Enable pnpm 10.33.0
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Install the reviewed lockfile
        run: pnpm install --frozen-lockfile

      - name: Run the complete non-mutating web gate
        id: verify
        shell: bash
        run: |
          set -o pipefail
          pnpm verify:web 2>&1 | tee verify-web.log
        env:
          CI: true
          NEXT_PUBLIC_APP_ENV: test
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_testfixture00000000000000000000
          NEXT_PUBLIC_REVENUECAT_WEB_KEY: test_revenuecat_key

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-web-diagnostics
          path: verify-web.log
          if-no-files-found: ignore
          retention-days: 3

  edge-functions:
    name: OpenAI-only Edge Function gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Deno 2
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.5

      - name: Type-check every active function entry point
        shell: bash
        run: deno check supabase/functions/*/index.ts

      - name: Run all Edge Function unit and contract tests
        run: deno test --allow-env --allow-read supabase/functions

      - name: Reject active non-OpenAI provider code
        shell: bash
        run: |
          if rg -n --glob '*.ts' --glob '!*.test.ts' '(anthropic|google[_-]?ai|gemini)' supabase/functions; then
            echo "::error::Active non-OpenAI provider code is prohibited."
            exit 1
          fi

  database:
    name: Fresh Supabase migration and policy gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js 22.23.2
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: "2.114.0"

      - name: Validate migration names and static ordering
        run: node scripts/check-migrations.mjs

      - name: Apply every migration to a fresh local database
        run: |
          supabase start -x studio,imgproxy,mailpit,logflare,vector,supavisor
          supabase db reset --local

      - name: Run local database tests
        run: supabase test db

      - name: Stop local services
        if: always()
        run: supabase stop --no-backup
